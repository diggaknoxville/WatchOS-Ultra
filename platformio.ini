; PlatformIO Project Configuration for VortexOS / KronosOS
; TARGET HARDWARE: LilyGo T-Watch Ultra (ESP32-S3, CO5300 QSPI AMOLED 410x502,
;                  XL9555 expander, AXP2101 PMU, PCF85063 RTC, BHI260 sensor,
;                  DRV2605 haptic, SX1262 LoRa). I2C main bus = GPIO3/GPIO2.
;
; Hardware bring-up is handled by LilyGoLib (global `instance`). The existing
; TFT_eSprite UI is rendered off-screen and blitted to the AMOLED via
; instance.pushColors(). Arduino-ESP32 core 3.3.x (pioarduino) is required.

[platformio]
default_envs = twatch-ultra
src_dir = src
include_dir = include

[env:twatch-ultra]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lilygo-t-watch-ultra
framework = arduino
board_build.partitions = app3M_fat9M_16MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LILYGO_LORA_SX1262          ; selects SX1262 as LilyGoLib `radio`
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; --- TFT_eSPI: used for OFF-SCREEN sprite rendering only (no HW output) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=18
    -DTFT_CS=12
    -DTFT_DC=38
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; LilyGoLib + its exact third-party dependency set live in lib/ ; the versioned
; libraries below are fetched by PlatformIO into .pio/libdeps.
lib_deps =
    lvgl/lvgl @ 9.4.0
    jgromes/RadioLib @ 7.4.0
    lewisxhe/XPowersLib @ ^0.3.3
    lewisxhe/SensorLib @ 0.3.3
    mikalhart/TinyGPSPlus @ ^1.1.0
    bodmer/TFT_eSPI @ ^2.5.43
    h2zero/NimBLE-Arduino @ ^2.2.0

upload_speed = 921600
monitor_speed = 115200
