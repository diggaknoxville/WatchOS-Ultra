; PlatformIO project configuration for WatchOS Ultra
; Target: LilyGo T-Watch Ultra (ESP32-S3, CO5300 QSPI AMOLED 410x502,
;         XL9555 expander, AXP2101 PMU, PCF85063 RTC, BHI260AP sensor hub,
;         DRV2605 haptic, SX1262 LoRa, u-blox GNSS, CST9217 touch).
;
; Hardware bring-up is handled by the vendored LilyGoLib fork (global
; `instance`, see lib/LilyGoLib/README.MD "Fork notice"). The UI is LVGL 9
; rendered on the UI task and pushed to the AMOLED via QSPI DMA.
; Pin definitions come from the `lilygo_twatch_ultra` variant of the
; pioarduino Arduino core (3.3.0, ESP-IDF 5.5), pinned below.

[platformio]
default_envs = twatch-ultra
src_dir = src
include_dir = include

[env:twatch-ultra]
; pinned pioarduino release: Arduino core 3.3.0 / ESP-IDF 5.5.0
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = lilygo-t-watch-ultra
framework = arduino
board_build.partitions = app3M_fat9M_16MB.csv

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_LILYGO_LORA_SX1262          ; selects SX1262 as LilyGoLib `radio`
    -DLV_CONF_INCLUDE_SIMPLE              ; lv_conf.h from lib/LilyGoLib/src
    -I include
; ARDUINO_USB_CDC_ON_BOOT / USB_MODE / PSRAM flags are defined once in
; boards/lilygo-t-watch-ultra.json (extra_flags), not here.

; LilyGoLib and TinyGPSPlus (required by LilyGoLib/GPS.h) are vendored in
; lib/. The registry libraries below are pinned to exact versions; they
; match the dependency list in lib/LilyGoLib/library.json.
lib_deps =
    lvgl/lvgl @ 9.4.0
    jgromes/RadioLib @ 7.4.0
    lewisxhe/XPowersLib @ 0.3.3
    lewisxhe/SensorLib @ 0.3.3
    h2zero/NimBLE-Arduino @ 2.5.2

upload_speed = 921600
monitor_speed = 115200
