name: Build WatchOS Ultra Firmware

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
      - 'REVIEW.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed for the release step on v* tags

env:
  PIO_ENV: twatch-ultra

jobs:
  build:
    name: Compile Firmware (PlatformIO)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'boards/lilygo-t-watch-ultra.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.2.0

      - name: Host unit tests
        run: pio test -e native

      - name: Compile firmware
        run: pio run -e ${{ env.PIO_ENV }}

      - name: Flash / RAM usage
        run: |
          pio run -e ${{ env.PIO_ENV }} -t size | tail -n 40
          ls -l .pio/build/${{ env.PIO_ENV }}/firmware.bin .pio/build/${{ env.PIO_ENV }}/firmware.elf
          echo "App partition limit: 3145728 bytes (app3M_fat9M_16MB.csv)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watchos-ultra-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            .pio/build/${{ env.PIO_ENV }}/firmware.bin
            .pio/build/${{ env.PIO_ENV }}/firmware.elf
            .pio/build/${{ env.PIO_ENV }}/firmware.map

      # Fixed asset names: the watch and tools/watchctl.py read
      # releases/latest/download/{version.json,firmware.bin,firmware.bin.sig}.
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir release
          cp .pio/build/${{ env.PIO_ENV }}/firmware.bin release/firmware.bin
          cp release/firmware.bin "release/watchos-ultra-${GITHUB_REF_NAME}.bin"
          (cd release && sha256sum "watchos-ultra-${GITHUB_REF_NAME}.bin" > "watchos-ultra-${GITHUB_REF_NAME}.bin.sha256")
          printf '{"version":"%s"}\n' "${GITHUB_REF_NAME#v}" > release/version.json
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            pip install cryptography
            python tools/sign_firmware.py sign release/firmware.bin
          else
            echo "::warning::UPDATE_SIGNING_KEY not set, release is unsigned"
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WatchOS Ultra ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
