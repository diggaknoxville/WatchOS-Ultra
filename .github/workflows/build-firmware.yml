name: Build WatchOS Ultra Firmware

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
      - 'REVIEW.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed for the release step on v* tags

env:
  PIO_ENV: twatch-ultra

jobs:
  build:
    name: Compile Firmware (PlatformIO)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'boards/lilygo-t-watch-ultra.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.2.0

      - name: Compile firmware
        run: pio run -e ${{ env.PIO_ENV }}

      - name: Flash / RAM usage
        run: |
          pio run -e ${{ env.PIO_ENV }} -t size | tail -n 40
          ls -l .pio/build/${{ env.PIO_ENV }}/firmware.bin .pio/build/${{ env.PIO_ENV }}/firmware.elf
          echo "App partition limit: 3145728 bytes (app3M_fat9M_16MB.csv)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watchos-ultra-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            .pio/build/${{ env.PIO_ENV }}/firmware.bin
            .pio/build/${{ env.PIO_ENV }}/firmware.elf
            .pio/build/${{ env.PIO_ENV }}/firmware.map

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp .pio/build/${{ env.PIO_ENV }}/firmware.bin "watchos-ultra-${GITHUB_REF_NAME}.bin"
          sha256sum "watchos-ultra-${GITHUB_REF_NAME}.bin" > "watchos-ultra-${GITHUB_REF_NAME}.bin.sha256"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WatchOS Ultra ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            watchos-ultra-${{ github.ref_name }}.bin
            watchos-ultra-${{ github.ref_name }}.bin.sha256
